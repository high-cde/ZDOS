# ZDOS resident organism boot profile
# Autostart is enabled only with zdos.organism=on on the kernel command line.
ZDOS_ORGANISM_PROGRAM=/usr/share/zdos-main.zlang
ZDOS_ORGANISM_STATE_DIR=/var/lib/zdos/organism
ZDOS_ORGANISM_RUNTIME=/usr/lib/zdos/zdos-organismd.py
ZDOS_ZLANG_ROOT=/usr/lib/zdos/Zlang
