name: Validate ZDOS connected microcosm

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  microcosm-contract:
    name: Validate catalog, contract and local gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZDOS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout pinned Zlang dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: high-cde/Zlang
          ref: 74958a3452897694f022ebfc8e2097702f3ba73a # compatibile con storage.read-v1
          path: Zlang
          fetch-depth: 1

      - name: Checkout zdos-organism for workspace inspection
        id: checkout_organism
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: high-cde/zdos-organism
          ref: e70a465f7c7eb8655f08e4003bfa1eb47ef386f9
          path: zdos-organism
          filter: blob:none
          sparse-checkout: README.md
          fetch-depth: 1
        continue-on-error: true

      - name: Checkout SEC Portal for workspace inspection
        id: checkout_sec_portal
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: high-cde/ZDOS-SEC-PORTAL
          ref: 47247dfd3eff79fbd0078b4187547dba37ac4818
          path: ZDOS-SEC-PORTAL
          filter: blob:none
          sparse-checkout: README.md
          fetch-depth: 1
        continue-on-error: true

      - name: Checkout Cybercore for workspace inspection
        id: checkout_cybercore
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: high-cde/Z-CYBERCORE
          ref: e8637a4e59e454a0b8bc0f748d4ed0d9bd5de4a0
          path: Z-CYBERCORE
          filter: blob:none
          sparse-checkout: README.md
          fetch-depth: 1
        continue-on-error: true

      - name: Remove failed optional checkouts
        if: steps.checkout_organism.outcome == 'failure' || steps.checkout_sec_portal.outcome == 'failure' || steps.checkout_cybercore.outcome == 'failure'
        run: |
          if [[ "${{ steps.checkout_organism.outcome }}" == failure ]]; then rm -rf -- zdos-organism; fi
          if [[ "${{ steps.checkout_sec_portal.outcome }}" == failure ]]; then rm -rf -- ZDOS-SEC-PORTAL; fi
          if [[ "${{ steps.checkout_cybercore.outcome }}" == failure ]]; then rm -rf -- Z-CYBERCORE; fi

      - name: Run connected-microcosm tests
        env:
          ZDOS_ZLANG_ROOT: ${{ github.workspace }}/Zlang
        run: python3 -m unittest microcosm/test_microcosm.py identity/test_identity.py commands/test_commands.py services/test_organismd.py zretro/ide/test_zretro.py

      - name: Inspect declared components without synchronization
        env:
          ZDOS_MICROCOSM_WORKSPACE: ${{ github.workspace }}
        run: ./microcosm/zdos-microctl inspect

      - name: Assert required Zlang checkout cleanliness
        run: |
          test -d Zlang
          test -z "$(git -C Zlang status --porcelain)"

      - name: Assert organism checkout cleanliness
        if: steps.checkout_organism.outcome == 'success'
        run: test -z "$(git -C zdos-organism status --porcelain)"

      - name: Assert SEC Portal checkout cleanliness
        if: steps.checkout_sec_portal.outcome == 'success'
        run: test -z "$(git -C ZDOS-SEC-PORTAL status --porcelain)"

      - name: Assert Cybercore checkout cleanliness
        if: steps.checkout_cybercore.outcome == 'success'
        run: test -z "$(git -C Z-CYBERCORE status --porcelain)"

      - name: Validate local entrypoints and release policy
        run: ./microcosm/zdos-microctl gate
