name: Validate ZDOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bootable-prototype:
    name: Build and boot ZDOS bare metal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZDOS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout pinned Zlang compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: high-cde/Zlang
          ref: 74958a3452897694f022ebfc8e2097702f3ba73a # compatibile con storage.read-v1
          path: Zlang

      - name: Install build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc binutils make grub-pc-bin xorriso mtools qemu-system-x86 python3 php-cli curl

      - name: Verify repository hygiene
        run: bash scripts/check-repository-hygiene.sh

      - name: Validate ZLB2 bootstrap contract
        run: python3 -m unittest discover -s os/x86_64/tools -p 'test_*.py' -v

      - name: Validate resident organism boot hook
        run: bash distro/test-organism-boot.sh

      - name: Compile and verify Multiboot2 kernel
        env:
          ZLANGC: ${{ github.workspace }}/Zlang/tools/zlangc.py
        run: |
          make -C os/x86_64 clean
          make -C os/x86_64 verify

      - name: Validate generated ZLB2 bytecode
        run: python3 os/x86_64/tools/test_zlb2.py os/x86_64/build/generated/zlang_program.h

      - name: Boot in QEMU and verify serial output
        env:
          ZLANGC: ${{ github.workspace }}/Zlang/tools/zlangc.py
        run: sh os/x86_64/tools/verify_qemu.sh

  linux-distro:
    name: Build and verify ZDOS Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZDOS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout pinned Zlang compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: high-cde/Zlang
          ref: 74958a3452897694f022ebfc8e2097702f3ba73a # compatibile con storage.read-v1
          path: Zlang

      - name: Install Linux distro build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bzip2 cpio e2fsprogs file gcc grub-pc-bin mtools qemu-system-x86 qemu-utils xorriso

      - name: Run strict Linux distro gate
        env:
          ZDOS_ZLANG_ROOT: ${{ github.workspace }}/Zlang
        run: ./tools/zdos-selftest.sh --all

      - name: Upload Linux ISO and checksum
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: zdos-linux-x86_64
          path: |
            distro/build/zdos-linux-x86_64.iso
            distro/build/zdos-linux-x86_64.iso.sha256
          if-no-files-found: error

  web-contract:
    name: Validate ZDOS web interfaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZDOS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interface/web/package-lock.json

      - name: Install and audit web dependencies
        working-directory: interface/web
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=low

      - name: Validate scripts and PHP
        run: |
          bash -n scripts/setup_all.sh
          bash -n os/x86_64/update_and_build.sh
          php -l web/backend/api.php

      - name: Serve and query local telemetry
        run: |
          php -S 127.0.0.1:8088 -t web >/tmp/zdos-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8088/backend/api.php?action=status | grep -F 'LOCAL_STATUS_ONLY'
